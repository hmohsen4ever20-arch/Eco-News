name: Build Signed Release APK (Bazaar & Myket)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'شماره نسخه عددی (نسخه اول: 1 | آپدیت‌های بعدی: 2، 3 و...)'
        required: true
        default: '1'
      version_name:
        description: 'نام نسخه نمایشی به کاربر (مثلاً 1.0 یا 1.1)'
        required: true
        default: '1.0'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Initialize Android Project
        run: |
          npm install
          npm run build
          npx cap init "Eco News" "ir.econews.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Custom Economy App Icon & Configure Android Back Key
        run: |
          pip install pillow
          python3 - << 'EOF'
          import os, shutil
          from PIL import Image, ImageDraw

          def create_eco_icon(size=512):
              img = Image.new("RGBA", (size, size), (6, 13, 11, 255))
              draw = ImageDraw.Draw(img)

              # قاب بیرونی طلایی و سبز بورس
              margin = int(size * 0.04)
              draw.rounded_rectangle(
                  [margin, margin, size-margin, size-margin],
                  radius=int(size*0.22),
                  fill=(12, 26, 22, 255),
                  outline=(245, 158, 11, 255),
                  width=int(size*0.026)
              )

              # دایره طلایی مرکزی (نماد سکه و بازار جهانی)
              c_pad = int(size * 0.13)
              draw.ellipse(
                  [c_pad, c_pad, size-c_pad, size-c_pad],
                  fill=(9, 20, 17, 255),
                  outline=(16, 185, 129, 255),
                  width=int(size*0.018)
              )

              # ستون‌های نمودار رشد مالی (سبز و طلایی)
              bars = [
                  (0.25, 0.56, 0.33, 0.74, (16, 185, 129, 255)),
                  (0.38, 0.46, 0.46, 0.74, (52, 211, 153, 255)),
                  (0.51, 0.35, 0.59, 0.74, (245, 158, 11, 255)),
                  (0.64, 0.24, 0.72, 0.74, (253, 224, 71, 255))
              ]
              for x1, y1, x2, y2, col in bars:
                  draw.rounded_rectangle(
                      [int(size*x1), int(size*y1), int(size*x2), int(size*y2)],
                      radius=int(size*0.02),
                      fill=col
                  )

              # فلش صعودی درخشان بالای نمودار
              pts = [
                  (int(size*0.24), int(size*0.48)),
                  (int(size*0.40), int(size*0.33)),
                  (int(size*0.50), int(size*0.40)),
                  (int(size*0.72), int(size*0.18))
              ]
              draw.line(pts, fill=(254, 240, 138, 255), width=int(size*0.032), joint="curve")
              draw.polygon([
                  (int(size*0.75), int(size*0.15)),
                  (int(size*0.62), int(size*0.17)),
                  (int(size*0.73), int(size*0.28))
              ], fill=(254, 240, 138, 255))

              return img

          icon = create_eco_icon(512)
          icon.save("EcoNews-Icon-512x512.png")

          res_dir = "android/app/src/main/res"
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in sizes.items():
              p = os.path.join(res_dir, folder)
              os.makedirs(p, exist_ok=True)
              resized = icon.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(p, "ic_launcher.png"))
              resized.save(os.path.join(p, "ic_launcher_round.png"))
              resized.save(os.path.join(p, "ic_launcher_foreground.png"))

          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)
          EOF

          cat << 'EOF' > android/app/src/main/java/ir/econews/app/MainActivity.java
          package ir.econews.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function(){ return window.handleAndroidBack ? window.handleAndroidBack() : 'EXIT'; })()",
                                  result -> {
                                      if (result != null && result.contains("EXIT")) {
                                          finish();
                                      }
                                  }
                              );
                          } else {
                              finish();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Apply Version Code, Permanent Keystore & Sign Release APK
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          VER_CODE="${{ github.event.inputs.version_code }}"
          VER_NAME="${{ github.event.inputs.version_name }}"
          VER_CODE=${VER_CODE:-1}
          VER_NAME=${VER_NAME:-"1.0"}

          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode $VER_CODE/g" app/build.gradle
          sed -i -E "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]+\"/versionName \"$VER_NAME\"/g" app/build.gradle

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using permanent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
          else
            echo "Generating new permanent keystore for first release..."
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias appkey -storepass 123456 -keypass 123456 \
              -dname "CN=EcoNews, OU=Mobile, O=EconomyApp, L=Mashhad, S=Khorasan, C=IR"
            base64 -w 0 release-key.jks > ../KEYSTORE_BASE64.txt
          fi

          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=123456

      - name: Prepare APK for Upload
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./EcoNews-Release.apk

      - name: Upload Signed APK, Store Icon & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: EcoNews-Bazaar-Myket-Package
          if-no-files-found: ignore
          path: |
            ./EcoNews-Release.apk
            ./EcoNews-Icon-512x512.png
            ./android/release-key.jks
            ./KEYSTORE_BASE64.txt
